spring.application.name=chumz-clone

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:6464/chumz_clone
spring.datasource.username=postgres
spring.datasource.password=mellosa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ---------- Daraja (M-Pesa) Sandbox ----------
# Get these from https://developer.safaricom.co.ke after creating a sandbox app
daraja.base-url=https://sandbox.safaricom.co.ke
daraja.consumer-key=YOUR_SANDBOX_CONSUMER_KEY
daraja.consumer-secret=YOUR_SANDBOX_CONSUMER_SECRET
daraja.shortcode=174379
daraja.passkey=YOUR_SANDBOX_PASSKEY
daraja.callback-url=https://your-ngrok-url.ngrok-free.app/api/mpesa/callback

# ---------- App ----------
server.port=8080
app.currency=KES
app.min-save-amount=5

logging.level.com.chumzclone=DEBUG
