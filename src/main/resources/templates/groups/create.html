<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New group · Chumz Clone</title>
    <link rel="stylesheet" th:href="@{/css/neumorphism.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('groups')}"></div>

    <div class="main-content" style="max-width: 560px;">
        <div class="page-header">
            <div>
                <h1>Start a group</h1>
                <p>You'll get a shareable invite code once it's created.</p>
            </div>
        </div>

        <div class="card neu-raised">
            <form th:action="@{/groups}" method="post">
                <div class="field">
                    <label for="name">Group name</label>
                    <input type="text" id="name" name="name" placeholder="Njuguna Family Chama" required>
                </div>
                <div class="field">
                    <label for="description">Description (optional)</label>
                    <textarea id="description" name="description" rows="3" placeholder="What are we saving for?"></textarea>
                </div>
                <div class="field">
                    <label for="targetAmount">Group target (KES, optional)</label>
                    <input type="number" id="targetAmount" name="targetAmount" min="0" step="0.01" placeholder="200000">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create group</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
