<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New goal · Chumz Clone</title>
    <link rel="stylesheet" th:href="@{/css/neumorphism.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('goals')}"></div>

    <div class="main-content" style="max-width: 560px;">
        <div class="page-header">
            <div>
                <h1>New goal</h1>
                <p>Give it a name, a target, and a date.</p>
            </div>
        </div>

        <div class="card neu-raised">
            <form th:action="@{/goals}" method="post">
                <div class="field">
                    <label for="name">Goal name</label>
                    <input type="text" id="name" name="name" placeholder="Emergency Fund" required>
                </div>
                <div class="field">
                    <label for="icon">Emoji icon (optional)</label>
                    <input type="text" id="icon" name="icon" placeholder="🛟" maxlength="2">
                </div>
                <div class="field">
                    <label for="targetAmount">Target amount (KES)</label>
                    <input type="number" id="targetAmount" name="targetAmount" placeholder="50000" min="5" step="0.01" required>
                </div>
                <div class="field">
                    <label for="targetDate">Target date (optional)</label>
                    <input type="date" id="targetDate" name="targetDate">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create goal</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
