<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign up · Chumz Clone</title>
    <link rel="stylesheet" th:href="@{/css/neumorphism.css}">
</head>
<body>

<div class="auth-shell">
    <div class="auth-card neu-raised">
        <div class="brand">💰 Chumz Clone</div>
        <div class="subtitle">Create your savings account</div>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Jane Wanjiru" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="phoneNumber">Phone number (M-Pesa)</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="2547XXXXXXXX" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a th:href="@{/auth/login}">Log in</a>
        </div>
    </div>
</div>

</body>
</html>
